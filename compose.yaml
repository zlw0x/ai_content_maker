x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-ai_content_maker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ai_content_maker}
    STORAGE_DIR: /app/private-media
  volumes:
    - media:/app/private-media

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_content_maker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_maker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_content_maker} -d ${POSTGRES_DB:-ai_content_maker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    command: ["npm","run","db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm","run","start"]

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm","run","worker"]

volumes:
  pgdata:
  media:
