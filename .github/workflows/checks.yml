name: Checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_ORIGIN: http://localhost:3000
      WAVESPEED_MODE: mock
      PAYMENT_MODE: disabled
      ALLOW_LIVE_PAYMENTS: "false"
      STORAGE_DIR: ./private-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Migrate
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - name: Smoke full backend in safe mock mode
        run: |
          npm run start > /tmp/ai-web.log 2>&1 &
          WEB_PID=$!
          npm run worker > /tmp/ai-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WEB_PID" "$WORKER_PID" 2>/dev/null || true; cat /tmp/ai-web.log; cat /tmp/ai-worker.log' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke
