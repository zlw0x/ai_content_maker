name: Checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_ORIGIN: http://localhost:3000
      WAVESPEED_MODE: mock
      PAYMENT_MODE: disabled
      ALLOW_LIVE_PAYMENTS: "false"
      STORAGE_DIR: ./private-media
      DEMO_CREDIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Migrate
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - name: Build Docker deployment image
        run: docker build --tag ai-content-maker:ci .
      - name: Install Chromium for UI test
        run: npx playwright install --with-deps chromium
      - name: Smoke full backend in safe mock mode
        run: |
          npm run start > /tmp/ai-web.log 2>&1 &
          WEB_PID=$!
          npm run worker > /tmp/ai-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WEB_PID" "$WORKER_PID" 2>/dev/null || true; cat /tmp/ai-web.log; cat /tmp/ai-worker.log' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke
          npm run test:e2e


  # Run the ACTUAL multi-container production image, migration and worker.
  # Unlike the npm-only job, this verifies Docker Compose wiring and real
  # container-to-container connectivity (while remaining in free mock mode).
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ai_content_maker:change_this_password@localhost:5432/ai_content_maker
      APP_ORIGIN: http://localhost:3000
      WAVESPEED_MODE: mock
      PAYMENT_MODE: disabled
      ALLOW_LIVE_PAYMENTS: "false"
      DEMO_CREDIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Start Docker Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for healthy app
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/v1/health/ready >/dev/null; then
              echo "Web, worker dependency and database migrations are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Dockerized service health"
          exit 1
      - name: Install Chromium for Dockerized UI tests
        run: npx playwright install --with-deps chromium
      - name: Run API, wallet and browser tests against Docker Compose
        run: |
          npm run test:smoke
          npm run test:e2e
      - name: Diagnose and clean up containers
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 || true
          docker compose down -v --remove-orphans || true
